name: virtual-inspection

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      ADDR: ":8080"
      DATA_FILE: "/data/issues.json"
    volumes:
      - inspection-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  inspection-data:
